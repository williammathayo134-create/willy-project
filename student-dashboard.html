<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - WUM</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        header { background: #00274c; color: #ffcb05; padding: 20px; text-align: center; border-radius: 8px; }
        h1 { margin: 0; font-size: 24px; }
        .container { max-width: 600px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #00274c; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn { display: block; width: 100%; background: #00274c; color: #ffcb05; padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }
        .btn:hover { background: #001f3f; }
        #result { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 4px; display: none; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #00274c; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Willy University of Michigan</h1>
        <p>Student Grading & Registration Portal</p>
    </header>

    <div class="container">
        <a href="index.html" class="back-link">&larr; Rudi Nyumbani</a>
        <h2>Ingiza Alama za Somo</h2>
        
        <form id="gradingForm" onsubmit="processData(event)">
            <div class="form-group">
                <label>Jina Kamili la Mwanafunzi:</label>
                <input type="text" id="studentName" required placeholder="Andika jina kamili...">
            </div>

            <div class="form-group">
                <label>Alama ya Midterm (max 40%):</label>
                <input type="number" id="midterm" min="0" max="40" required placeholder="Weka 0 - 40">
            </div>

            <div class="form-group">
                <label>Alama ya Final (max 60%):</label>
                <input type="number" id="finalExam" min="0" max="60" required placeholder="Weka 0 - 60">
            </div>

            <button type="submit" class="btn">Piga Hesabu na Toa Matokeo</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        function processData(event) {
            event.preventDefault();
            let name = document.getElementById('studentName').value.trim();
            let midterm = parseFloat(document.getElementById('midterm').value);
            let finalExam = parseFloat(document.getElementById('finalExam').value);

            if (name.length < 3 || /\d/.test(name)) {
                alert("Tafadhali ingiza Jina halisi la mwanafunzi (lisipungue herufi 3 wala kuwa na namba).");
                return;
            }
            if (isNaN(midterm) || midterm < 0 || midterm > 40) {
                alert("Kosa: Alama ya Midterm lazima iwe kati ya 0 na 40.");
                return;
            }
            if (isNaN(finalExam) || finalExam < 0 || finalExam > 60) {
                alert("Kosa: Alama ya Final lazima iwe kati ya 0 na 60.");
                return;
            }

            let randomNum = Math.floor(100 + Math.random() * 900);
            let regNumber = "WUM/2026/" + randomNum;
            let totalScore = midterm + finalExam;
            let grade = "";

            if (totalScore >= 70) grade = "A (Bora Sana)";
            else if (totalScore >= 60) grade = "B (Vizuri Sana)";
            else if (totalScore >= 50) grade = "C (Vizuri)";
            else if (totalScore >= 40) grade = "D (Dhaifu)";
            else grade = "F (Imelianguka)";

            let resultDiv = document.getElementById('result');
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `
                <h3 style="margin-top:0;">Matokeo Yametoka!</h3>
                <p><strong>Namba ya Usajili (Imetolewa na Mfumo):</strong> ${regNumber}</p>
                <p><strong>Mwanafunzi:</strong> ${name}</p>
                <p><strong>Jumla ya Alama:</strong> ${totalScore} / 100</p>
                <p><strong>Daraja:</strong> ${grade}</p>
            `;
        }
    </script>

</body>
</html>
