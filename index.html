<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willy University of Michigan</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 0; color: #333; text-align: center; }
        header { background: #00274c; color: #ffcb05; padding: 30px 20px; }
        h1 { margin: 0; font-size: 26px; }
        p { font-size: 16px; color: #555; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn { display: block; background: #00274c; color: #ffcb05; padding: 15px; margin: 15px 0; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .btn:hover { background: #001f3f; }
    </style>
</head>
<body>
    <header>
        <h1>Willy University of Michigan</h1>
        <p>Welcome to Excellence and Innovation</p>
    </header>
    <div class="container">
        <h2>Chagua Huduma</h2>
           <script>
        function processData(event) {
            event.preventDefault();

            let name = document.getElementById('studentName').value.trim();
            let midterm = parseFloat(document.getElementById('midterm').value);
            let finalExam = parseFloat(document.getElementById('finalExam').value);

            // Kinga dhidi ya taarifa za uongo (kama jina lina namba au ni fupi sana)
            if (name.length < 3 || /\d/.test(name)) {
                alert("Tafadhali ingiza Jina halisi la mwanafunzi (lisipungue herufi 3 wala kuwa na namba).");
                return;
            }

            // Kuhakikisha alama za Midterm ziko sahihi (0 hadi 40)
            if (isNaN(midterm) || midterm < 0 || midterm > 40) {
                alert("Kosa: Alama ya Midterm lazima iwe kati ya 0 na 40.");
                return;
            }

            // Kuhakikisha alama za Final ziko sahihi (0 hadi 60)
            if (isNaN(finalExam) || finalExam < 0 || finalExam > 60) {
                alert("Kosa: Alama ya Final lazima iwe kati ya 0 na 60.");
                return;
            }

            // Mfumo unajizalishia Namba ya Usajili peke yake
            let randomNum = Math.floor(100 + Math.random() * 900);
            let regNumber = "WUM/2026/" + randomNum;

            let totalScore = midterm + finalExam;
            let grade = "";

            if (totalScore >= 70) grade = "A (Bora Sana)";
            else if (totalScore >= 60) grade = "B (Vizuri Sana)";
            else if (totalScore >= 50) grade = "C (Vizuri)";
            else if (totalScore >= 40) grade = "D (Dhaifu)";
            else grade = "F (Imelianguka)";

            let resultDiv = document.getElementById('result');
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `
                <h3>Matokeo Yametoka!</h3>
                <p><strong>Namba ya Usajili (Imetolewa na Mfumo):</strong> ${regNumber}</p>
                <p><strong>Mwanafunzi:</strong> ${name}</p>
                <p><strong>Jumla ya Alama:</strong> ${totalScore} / 100</p>
                <p><strong>Daraja:</strong> ${grade}</p>
            `;
        }
    </script>

 </div>
</body>
</html>
