    <!-- JAVASCRIPT LOGIC KWA AJILI YA VIPENGELE 15 VYOTE -->
    <script>
        // API Keys (Groq & Hugging Face zilizowekwa awali)
        const GROQ_API_KEY ="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";
        const HF_API_TOKEN ="Hf_yDNYvGjVhoVFVnWLagxVKmrhumeglUWkuV";

        let chatHistory = []; 
        let currentAttachment = null;
        let isListening = false;

        // Anzisha mfumo mzigo unapofunguka - Unatengeneza ukurasa msafi na kupakia archives
        window.addEventListener('DOMContentLoaded', () => {
            renderArchivedSessionsMenu();
            checkOnlineStatus();
            window.addEventListener('online', checkOnlineStatus);
            window.addEventListener('offline', checkOnlineStatus);
        });

        // 1. Menyu ya Vidoti Vitatu (Three-Dots Menu Toggle)
        function toggleMenu() {
            const menu = document.getElementById('dropdown-menu');
            menu.classList.toggle('hidden');
        }
        window.addEventListener('click', (e) => {
            const menu = document.getElementById('dropdown-menu');
            const btn = e.target.closest('button');
            if (!menu.contains(e.target) && (!btn || !btn.getAttribute('onclick')?.includes('toggleMenu'))) {
                menu.classList.add('hidden');
            }
        });

        // 2. Hali ya Giza na Nuru (Dark/Light Mode Toggle)
        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = "fa-solid fa-sun";
                localStorage.setItem('willy_theme', 'light');
            } else {
                html.classList.add('dark');
                icon.className = "fa-solid fa-moon";
                localStorage.setItem('willy_theme', 'dark');
            }
        }

        // 3. Sehemu ya Kutafuta Ndani ya Historia (Search Chat History)
        function toggleSearchBox() {
            const box = document.getElementById('search-container');
            box.classList.toggle('hidden');
            if (!box.classList.contains('hidden')) {
                document.getElementById('search-input').focus();
            } else {
                loadSavedHistory(); // Rudisha historia ya kawaida
            }
        }

        function searchMessages(query) {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            const filtered = chatHistory.filter(item => item.text.toLowerCase().includes(query.toLowerCase()));
            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 py-8 text-sm">Hakuna ujumbe uliopatikana unaofanana na "${query}"</div>`;
                return;
            }
            filtered.forEach(msg => {
                appendMessageToDOM(msg.sender, msg.text, msg.time, msg.attachment);
            });
        }

        // 4. Kupakia Picha (Image Upload)
        function handleImageSelected(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                currentAttachment = {
                    type: 'image',
                    url: e.target.result,
                    name: file.name
                };
                document.getElementById('preview-img-tag').src = e.target.result;
                document.getElementById('preview-img-tag').classList.remove('hidden');
                document.getElementById('preview-file-icon').classList.add('hidden');
                document.getElementById('preview-name').innerText = file.name;
                document.getElementById('attachment-preview').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        // 5. Kusoma Faili au Hati za Shule/Kiufundi (File/Document Upload)
        function handleDocumentSelected(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                currentAttachment = {
                    type: 'file',
                    url: e.target.result,
                    name: file.name,
                    content: e.target.result
                };
                document.getElementById('preview-img-tag').classList.add('hidden');
                document.getElementById('preview-file-icon').classList.remove('hidden');
                document.getElementById('preview-name').innerText = file.name;
                document.getElementById('attachment-preview').classList.remove('hidden');
            };
            reader.readAsText(file); // Kusoma maandishi ya hati
        }

        function clearAttachment() {
            currentAttachment = null;
            document.getElementById('attachment-preview').classList.add('hidden');
            document.getElementById('image-input').value = '';
            document.getElementById('document-input').value = '';
        }

        // 6. Kitufe cha Sauti (Voice Input / Microphone) kutumia Web Speech API
        function toggleVoiceInput() {
            const micBtn = document.getElementById('mic-btn');
            const input = document.getElementById('user-input');
            
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Samahani, kivinjari chako hakitumii kipengele cha sauti.");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'sw-TZ'; // Swahili ya Tanzania
            recognition.interimResults = false;

            if (!isListening) {
                recognition.start();
                isListening = true;
                micBtn.classList.add('text-red-500', 'animate-pulse');
            }

            recognition.onresult = function(event) {
                const speechText = event.results[0][0].transcript;
                input.value += (input.value ? ' ' : '') + speechText;
                isListening = false;
                micBtn.classList.remove('text-red-500', 'animate-pulse');
            };

            recognition.onerror = function() {
                isListening = false;
                micBtn.classList.remove('text-red-500', 'animate-pulse');
            };

            recognition.onend = function() {
                isListening = false;
                micBtn.classList.remove('text-red-500', 'animate-pulse');
            };
        }

        // 7. Kipengele cha Kusikiliza Majibu (Text-to-Speech)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'sw-TZ';
                window.speechSynthesis.speak(utterance);
            }
        }

        // 8. Kitendo cha Kunakili (Copy Response)
        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("Ujumbe umenakiliwa kwenye ubao wa klipu!");
            });
        }

        // 9. Mfumo wa Kuingia na Google (Login with Google)
        function triggerGoogleLogin() {
            alert("Mfumo wa Google OAuth umeunganishwa kwa ajili ya utambulisho wa William Mathayo (ICoT Campus Portal).");
            toggleMenu();
        }

        // 10. Kitufe cha Kusafirisha Mazungumzo kama PDF (Export Chat to PDF)
        function exportChatToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("helvetica");
            doc.setFontSize(16);
            doc.text("Williams Auto Electric Engineer - Chat History", 14, 20);
            
            doc.setFontSize(10);
            let y = 30;
            chatHistory.forEach((chat, index) => {
                const line = `${chat.sender === 'user' ? 'William' : 'AI'} [${chat.time}]: ${chat.text}`;
                const splitLines = doc.splitTextToSize(line, 180);
                if (y > 280) {
                    doc.addPage();
                    y = 20;
                }
                doc.text(splitLines, 14, y);
                y += (splitLines.length * 6) + 4;
            });
            doc.save("Williams_Auto_Electric_Chat.pdf");
            toggleMenu();
        }

        // 11. Hali ya Nje ya Mtandao (Offline Fallback Mode)
        function checkOnlineStatus() {
            if (!navigator.onLine) {
                console.warn("Hali ya nje ya mtandao imegunduliwa.");
            }
        }

        function getOfflineFallbackResponse(query) {
            const q = query.toLowerCase();
            if (q.includes('gari') || q.includes('engine') || q.includes('fuel')) {
                return "🔌 [Offline Mode] Kulingana na masomo ya ICoT, mfumo wa mafuta na hewa (Air-Fuel Ratio) unapaswa kuwa katika uwiano sahihi ili injini iwake vizuri bila kupoteza nguvu.";
            }
            return "🔌 [Offline Mode] Samahani mkuu William, hauna mtandao kwa sasa. Hili ni jibu la msingi kutoka kwenye kumbukumbu za ndani za mfumo.";
        }

        // 12. Sehemu ya Kufuta Mazungumzo (Clear Chat History)
        function clearChatHistory() {
            if (confirm("Je, una uhakika unataka kufuta historia yote ya mazungumzo?")) {
                chatHistory = [];
                localStorage.removeItem('willy_auto_chat_history');
                document.getElementById('chat-container').innerHTML = '';
                toggleMenu();
            }
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // 13. Kutunza Historia kwenye localStorage (Chat History Storage)
                function saveToHistory(sender, text, attachment = null) {
            chatHistory.push({ sender, text, attachment, time: new Date().toISOString() });

            let archives = JSON.parse(localStorage.getItem('willy_chat_archives')) || [];
            
            if (archives.length === 0 || archives[0].active !== true) {
                archives.unshift({
                    id: Date.now(),
                    date: new Date().toLocaleString(),
                    messages: chatHistory,
                    active: true
                });
            } else {
                archives[0].messages = chatHistory;
            }

            localStorage.setItem('willy_chat_archives', JSON.stringify(archives));
        }
  function appendMessageToDOM(sender, text, time, attachment = null) {
            const container = document.getElementById('chat-container');
            const wrapper = document.createElement('div');
            const isUser = sender === 'user';
            
            wrapper.className = `flex items-start space-x-3 animate-fade-in ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            let attachmentHTML = '';
            if (attachment) {
                if (attachment.type === 'image') {
                    attachmentHTML = `<img src="${attachment.url}" class="rounded-xl max-h-48 mb-2 object-cover w-full">`;
                } else {
                    attachmentHTML = `<div class="bg-slate-200 dark:bg-slate-800 p-2 rounded-xl mb-2 text-xs flex items-center space-x-2"><i class="fa-solid fa-file-lines"></i><span class="truncate">${attachment.name}</span></div>`;
                }
            }

            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full ${isUser ? 'bg-slate-700' : 'bg-brand-600'} flex items-center justify-center text-white text-xs shrink-0 shadow">
                    <i class="fa-solid ${isUser ? 'fa-user' : 'fa-bolt'}"></i>
                </div>
                <div class="${isUser ? 'bg-brand-600 text-white' : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800'} rounded-2xl p-4 shadow-sm max-w-[85%] sm:max-w-[75%] text-sm">
                    <p class="font-semibold mb-1 ${isUser ? 'text-white' : 'text-brand-600 dark:text-brand-400'}">${isUser ? 'William Mathayo' : 'Williams Auto Electric AI'}</p>

        // 14. KUUNGANISHA HUGGING FACE (IMAGE RECOGNITION) NA GROQ (LLM CHAT)
    async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text && !currentAttachment) return;

    let imagePayload = currentAttachment ? currentAttachment.url : null;
    let currentAttObj = currentAttachment;

    const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    appendMessageToDOM('user', text || "Nimeweka faili/picha hii kwa uchambuzi.", timeNow, currentAttObj);
    saveToHistory('user', text || "Nimeweka faili/picha hii kwa uchambuzi.", currentAttObj);

    input.value = '';
    clearAttachment();

    document.getElementById('typing-indicator').classList.remove('hidden');

    if (!navigator.onLine) {
        document.getElementById('typing-indicator').classList.add('hidden');
        const offlineResp = getOfflineFallbackResponse(text);
        appendMessageToDOM('ai', offlineResp, timeNow);
        saveToHistory('ai', offlineResp);
        return;
    }

    let finalPromptForGroq = text;

    if (imagePayload) {
        try {
            const base64Data = imagePayload.split(',')[1];
            const byteCharacters = atob(base64Data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: 'image/jpeg' });

            const hfResponse = await fetch("https://api-inference.huggingface.co/models/Salesforce/blip-image-captioning-large", {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${HF_API_TOKEN}`
                },
                body: blob
            });

            const hfData = await hfResponse.json();
            let imageDescription = "";
            if (Array.isArray(hfData) && hfData[0]?.generated_text) {
                imageDescription = hfData[0].generated_text;
                finalPromptForGroq = `[Maelezo ya Picha Iliyopakiwa: ${imageDescription}] ${text}`;
            }
        } catch (e) {
            console.error("HF Vision Error:", e);
        }
    }

    // Inatengeneza historia yote ya mazungumzo badala ya ujumbe mmoja
    const formattedMessages = chatHistory.map(msg => ({
        role: msg.sender === 'user' ? 'user' : 'assistant',
        content: msg.text
    }));

    try {
        if (!GROQ_API_KEY) {
            throw new Error("GROQ_API_KEY haijapatikana.");
        }

        const groqResponse = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${GROQ_API_KEY}`
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: formattedMessages
            })
        });
        
        const groqData = await groqResponse.json();
        document.getElementById('typing-indicator').classList.add('hidden');

        let aiResponseText = "";
        if (groqData.error) {
            aiResponseText = "Hitilafu kutoka Groq API: " + (groqData.error.message || "Ufunguo si sahihi");
        } else if (groqData.choices && groqData.choices[0].message.content) {
            aiResponseText = groqData.choices[0].message.content;
        } else {
            aiResponseText = "Samahani, jibu halikupatikana kutoka Groq.";
        }

        const responseTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        streamMessageToDOM('ai', aiResponseText, responseTime);
        saveToHistory('ai', aiResponseText);

    } catch (error) {
        document.getElementById('typing-indicator').classList.add('hidden');
        const netError = "Hitilafu: " + error.message;
        appendMessageToDOM('ai', netError, timeNow);
        saveToHistory('ai', netError);
    }

        function streamMessageToDOM(sender, fullText, time) {

            const wrapper = document.createElement('div');
            const isUser = sender === 'user';

            wrapper.className = `flex items-start space-x-3 animate-fade-in ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

        // 2. Orodha ya Lugha 5 Kuu (Kiswahili, Kiingereza, Kifaransa, Kiarabu, Kispanyola)
        const supportedLangs = ['sw', 'en', 'fr', 'ar', 'es'];

        let systemVoices = [];

        function loadCustomVoiceOptions() {
            if (!('speechSynthesis' in window)) return;

            systemVoices = window.speechSynthesis.getVoices();
            const voiceSelect = document.getElementById('voice-select-custom');
            if (!voiceSelect) return;

            voiceSelect.innerHTML = '';

            // Sauti zilizochujwa kwa lugha 5
            const filteredVoices = systemVoices.filter(v => 
                supportedLangs.some(lang => v.lang.toLowerCase().startsWith(lang))
            );

            if (filteredVoices.length === 0) {
                // Kama hakuna lugha hizo, pakia sauti zote zilizopo
                systemVoices.forEach((v, index) => {
                    const opt = document.createElement('option');
                    opt.value = index;
                    opt.textContent = `${v.name} (${v.lang})`;
                    voiceSelect.appendChild(opt);
                });
                return;
            }

            filteredVoices.forEach((voice) => {
                const realIndex = systemVoices.indexOf(voice);
                const opt = document.createElement('option');
                opt.value = realIndex;
                
                // Tambua au weka alama ya Jinsia kulingana na jina la sauti
                let genderTag = "Mwanamke (30 Yrs)";
                const nameLower = voice.name.toLowerCase();
                if (nameLower.includes('male') || nameLower.includes('david') || nameLower.includes('george') || nameLower.includes('guy') || nameLower.includes('stefan')) {
                    genderTag = "Mwanaume (27 Yrs)";
                }

                // Onyesha Jinsia na Lugha
                opt.textContent = `${voice.name} — ${genderTag} [${voice.lang}]`;
                
                // Weka Kiswahili au English kama sauti chaguo la kwanza (Default)
                if (voice.lang.includes('sw') || voice.lang.includes('en')) {
                    opt.selected = true;
                }

                voiceSelect.appendChild(opt);
            });
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadCustomVoiceOptions;
            loadCustomVoiceOptions();
        }

   // Function ya Kuchukua Skrini (Screen Capture)
async function captureScreen() {
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    const track = stream.getVideoTracks()[0];
    const imageCapture = new ImageCapture(track);
    const bitmap = await imageCapture.grabFrame();
    
    const canvas = document.createElement('canvas');
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;
    const context = canvas.getContext('2d');
    context.drawImage(bitmap, 0, 0, bitmap.width, bitmap.height);
    
    const screenDataUrl = canvas.toDataURL('image/png');
    track.stop(); // Funga kinasa skrini baada ya kuchukua picha
    
    // Weka picha kwenye sehemu ya preview
    currentAttachment = { type: 'image', url: screenDataUrl, name: 'Screen Capture' };
    document.getElementById('preview-img-tag').src = screenDataUrl;
    document.getElementById('preview-img-tag').classList.remove('hidden');
    document.getElementById('preview-file-icon').classList.add('hidden');
    document.getElementById('preview-name').innerText = 'Screen Capture';
    document.getElementById('attachment-preview').classList.remove('hidden');
  } catch (err) {
    alert("Hujatoa ruhusa ya kuchukua skrini au browser yako haiafikiani nayo.");
  }
}
