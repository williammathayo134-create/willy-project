here<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Willy University</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #00274c; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; background: #00274c; color: #ffcb05; padding: 12px; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #001f3f; }
        .back-link { display: block; margin-top: 15px; color: #666; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Student Registration</h2>
        <!-- Form sasa inaita handleStudentRegister(event) wakati wa kusubmit -->
        <form onsubmit="handleStudentRegister(event)">
            <input type="text" id="fullName" placeholder="Jina Kamili" required>
            <input type="email" id="email" placeholder="Barua Pepe (Email)" required>
            <input type="tel" id="phone" placeholder="Namba ya Simu" required>
            <button type="submit" class="btn">Sajili / Ingia</button>
        </form>
        <a href="index.html" class="back-link">Rudi Nyuma</a>
    </div>

    <!-- 1. Maktaba ya Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      // 2. Anzisha Supabase Client
      const SUPABASE_URL = 'https://yeknndybcythktjhqg.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_DIRrZcp4bUVnRXmovQnksg_j74R0JWI';
      const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // 3. Function ya kusajili mwanafunzi mpya
      async function handleStudentRegister(event) {
        event.preventDefault(); // Kuzuia ukurasa kurefresh

        const fullName = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;

        const { data, error } = await _supabase
          .from('students')
          .insert([
            { full_name: fullName, email: email, phone: phone }
          ]);

        if (error) {
          alert("Imeshindikana kuhifadhi: " + error.message);
        } else {
          alert("Mwanafunzi amesajiliwa kikamilifu!");
          window.location.href = "student-dashboard.html"; // Mpeleke kwenye dashboard
        }
      }
    </script>
</body>
</html>
